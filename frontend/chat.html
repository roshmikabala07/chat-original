
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Chat Application</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">Connect <span>●</span></div>

        <div class="account">
            <span id="currentUserName"></span>
            <button id="logoutButton" type="button">Logout</button>
        </div>
    </header>

    <main class="app">
        <aside class="sidebar">
            <h3>People</h3>
            <div id="userList">Loading users...</div>

            <div class="section-heading">
                <h3>Group Chats</h3>
                <button id="createGroupButton" type="button">+ Create</button>
            </div>

            <div id="groupList">Loading groups...</div>
        </aside>

        <section class="chat-panel">
            <div id="chatTitle" class="chat-heading">
                Select a person or group to start chatting
            </div>

            <div id="messages" aria-live="polite">
                <p class="empty-state">Your conversations will appear here.</p>
            </div>

            <p id="status" role="status"></p>

            <form id="messageForm">
                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type a message..."
                    maxlength="5000"
                    autocomplete="off"
                    disabled
                    required
                >
                <button type="submit" disabled>Send</button>
            </form>
        </section>
    </main>

    <script src="chat.js"></script>
</body>
</html>
