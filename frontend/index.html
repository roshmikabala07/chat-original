
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Chat Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="welcome">
            <div class="logo">C</div>
            <h1>Connect</h1>
            <p>Every conversation brings us closer.</p>
            <div class="chat-icon">💬</div>
            <p class="welcome-text">
                Your space to connect, communicate and share.
            </p>
        </section>

        <section class="form-section">
            <div class="tabs">
                <button id="loginTab" class="tab active" type="button">
                    Login
                </button>
                <button id="registerTab" class="tab" type="button">
                    Register
                </button>
            </div>

            <h2 id="formTitle">Welcome back!</h2>
            <p id="formSubtitle">Login to continue chatting.</p>

            <form id="authForm">
                <div id="nameField" class="field hidden">
                    <label for="name">Full name</label>
                    <input id="name" type="text" placeholder="Enter your name">
                </div>

                <div id="phoneField" class="field hidden">
                    <label for="phone">Phone number</label>
                    <input id="phone" type="tel" placeholder="Enter phone number">
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" type="email"
                           placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password"
                           placeholder="Enter password" required>
                </div>

                <button id="submitButton" class="submit-btn" type="submit">
                    Login
                </button>

                <p id="message" role="status"></p>
            </form>

            <p class="switch-text">
                <span id="switchLabel">Don't have an account?</span>
                <button id="switchButton" type="button">Register</button>
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
