<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>
            <p class="subtitle">Join the Chat Application</p>

            <form id="registerForm">

                <label>Name</label>
                <input type="text" id="registerName" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="Enter your email" required>

                <label>Phone</label>
                <input type="text" id="registerPhone" placeholder="Enter your phone number" required>

                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password" required>

                <button type="submit">Register</button>

            </form>

            <p class="switch-page">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
